<!DOCTYPE html>
<html>
<head>
    <title>FrontDoor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
     <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f1117;
            color: #e6e6e6;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .card {
            background: #161a22;
            border: 1px solid #242a38;
            border-radius: 12px;
            padding: 14px 16px;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            background: #1b2130;
        }

        a {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }

        .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        .name {
            font-weight: 500;
        }

        .hint {
            font-size: 12px;
            color: #8b93a7;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="container">
<h1>FrontDoor</h1>
<h2>Add New Item</h2>
<div class="container">

    <h3>➕ Add Service</h3>

    <div class="form-card">

        <form action="/add" method="POST">
        <div class="grid">
            <div class="form-group">
                <label for="name">Name</label>
                <input
                    id="name"
                    type="text"
                    name="name"
                    placeholder="Grafana"
                    required>
            </div>

            <div class="form-group">
                <label for="url">URL</label>
                <input
                    id="url"
                    type="url"
                    name="url"
                    placeholder="http://10.0.0.8:3000"
                    required>
            </div>

            <div class="buttons">
                <button type="submit">💾 Save</button>
            </div>
        </div>
            

        </form>

    </div>

</div>
</body>
</html>
